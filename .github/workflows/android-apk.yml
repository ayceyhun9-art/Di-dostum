name: Dis Dostum APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q Dis_Dostum_Android_Kaynak_Projesi.zip -d source

      - name: Build APK
        working-directory: source/DisDostumAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Dis-Dostum-APK
          path: source/DisDostumAndroid/app/build/outputs/apk/debug/app-debug.apk
